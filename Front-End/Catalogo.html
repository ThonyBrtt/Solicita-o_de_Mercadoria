<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Revest Bem – Catálogo</title>
  <link rel="icon" href="Imagens/Logo.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Css/catologo.css">

</head>
<body>

  <!-- ── TOPBAR ── -->
  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-icon">
        <img src="Imagens/Logo.png" alt="LogoEmpresa" width="32" height="32"
             style="object-fit:contain; border-radius:4px;"
             onerror="this.style.display='none'; this.parentElement.innerHTML='<svg viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%233A2A10\' stroke-width=\'2\'><rect x=\'2\' y=\'3\' width=\'20\' height=\'14\' rx=\'2\'/></svg>'">
      </div>
      <div class="brand-name">
        Revestbem
        <small>Estoque</small>
      </div>
    </div>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="user-avatar" id="avatarLetra">V</div>
        <div class="user-info">
          <div class="u-name" id="usuarioNome">Vendedor</div>
          <div class="u-role" id="perfilUsuario">Vendedor</div>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sair
      </button>
    </div>
  </header>

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-section">Menu</div>
    <a class="nav-item" href="home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      Nova Solicitação
    </a>
    <a class="nav-item" href="solicitacoes.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      Minhas Solicitações
    </a>
    <div class="sidebar-section">Sistema</div>
    <a class="nav-item active" href="catalogo.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      Catálogo
    </a>
    <a class="nav-item" href="configuracoes.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.07 4.93l-1.41 1.41M16.24 7.76a6 6 0 1 0 0 8.49"/>
      </svg>
      Configurações
    </a>
  </aside>

  <!-- ── MAIN ── -->
  <main class="main">

    <!-- HEADER -->
    <div class="page-header">
      <div>
        <div class="page-title">Catálogo de Materiais</div>
        <div class="page-subtitle">Consulte disponibilidade e detalhes dos produtos</div>
      </div>
      <div class="view-toggle">
        <button class="btn-toggle active" id="btnGrid" onclick="setView('grid')" title="Visualização em grade">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
          </svg>
        </button>
        <button class="btn-toggle" id="btnLista" onclick="setView('lista')" title="Visualização em lista">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/>
            <line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- FILTROS -->
    <div class="card" style="animation-delay:0.05s">
      <div class="card-head">
        <div class="card-head-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          Filtrar Produtos
        </div>
      </div>
      <div class="card-body">
        <div class="filtros-row">
          <input class="input-base" type="text" id="filtroNome"
                 placeholder="Buscar por nome ou SKU..."
                 oninput="filtrar()"/>
          <select class="input-base" id="filtroCategoria" onchange="filtrar()">
            <option value="">Todas as categorias</option>
            <option value="Cortina">Cortina</option>
            <option value="Blackout">Blackout</option>
            <option value="Capotaria">Capotaria</option>
            <option value="Estofados">Estofados</option>
            <option value="Automotivo">Automotivo</option>
          </select>
          <select class="input-base" id="filtroEstoque" onchange="filtrar()">
            <option value="">Todos os estoques</option>
            <option value="ok">Disponível</option>
            <option value="baixo">Estoque Baixo</option>
            <option value="sem">Sem Estoque</option>
          </select>
          <button class="btn-buscar" onclick="limparFiltros()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
            </svg>
            Limpar
          </button>
        </div>
      </div>
    </div>

    <!-- PRODUTOS -->
    <div class="card" style="animation-delay:0.12s">
      <div class="card-head dark">
        <div class="card-head-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          Produtos
          <span class="badge-count" id="totalProdutos">0</span>
        </div>
      </div>

      <!-- GRID VIEW -->
      <div id="viewGrid" class="catalogo-grid"></div>

      <!-- LISTA VIEW -->
      <div id="viewLista" class="table-wrap" style="display:none">
        <table>
          <thead>
            <tr>
              <th>SKU</th>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Material</th>
              <th>Estoque</th>
              <th>Status</th>
              <th style="width:80px"></th>
            </tr>
          </thead>
          <tbody id="tabelaLista"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- ── MODAL DETALHES ── -->
  <div class="overlay" id="overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-header-title" id="modalTitulo">Detalhes do Produto</div>
        <button class="modal-close" onclick="fecharModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-body">
    <div class="modal-fields" id="modalFields"></div>
</div>
        <div class="modal-fields" id="modalFields"></div>
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="fecharModal()">Fechar</button>
        <button class="btn-confirm" onclick="irParaSolicitacao()">
          + Adicionar à Solicitação
        </button>
      </div>
    </div>
  </div>

  <!-- ── TOAST ── -->
  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span id="toastMsg"></span>
  </div>
<script src="js/catalogo.js"></script>
</body>
</html>
