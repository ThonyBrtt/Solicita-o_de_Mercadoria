<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Revest Bem – Configurações</title>
  <link rel="icon" href="Imagens/Logo.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Css/home.css">
</head>
<body>

  <!-- ── TOPBAR ── -->
  <header class="topbar">
    <div class="topbar-brand">
  <div class="brand-icon">
    <img src="Imagens/Logo.png" alt="LogoEmpresa" width="32" height="32" 
         style="object-fit:contain; border-radius:4px;">
  </div>
  <div class="brand-name">
    Revestbem
    <small>Estoque</small>
  </div>
</div>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="user-avatar" id="avatarLetra">V</div>
        <div class="user-info">
          <div class="u-name" id="usuarioNome">Vendedor</div>
          <div class="u-role" id="perfilUsuario">Vendedor</div>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sair
      </button>
    </div>
  </header>

  <aside class="sidebar">
    <div class="sidebar-section">Painel</div>
    <a class="nav-item" href="logistica.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      Todas as Solicitações
    </a>
    <a class="nav-item" href="usuarios.html">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
    <circle cx="9" cy="7" r="4"/>
    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  </svg>
  Usuários
</a>
    <div class="sidebar-section">Sistema</div>
    <a class="nav-item" href="estoque.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      Catalogo
    </a>
    <a class="nav-item active" href="configuracoes.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.07 4.93l-1.41 1.41M16.24 7.76a6 6 0 1 0 0 8.49"/>
      </svg>
      Configurações
    </a>
  </aside>

  <main class="main">

    <div class="page-header">
      <div>
        <div class="page-title">Configurações</div>
        <div class="page-subtitle">Gerencie suas preferências</div>
      </div>
    </div>

    <!-- ALTERAR SENHA -->
    <div class="card">
      <div class="card-head">
        <div class="card-head-title">Alterar Senha</div>
      </div>
      <div class="card-body">
        <div class="motivo-row">
          <div>
            <label class="field-label" for="senhaAtual">Senha Atual</label>
            <input type="password" class="input-base" id="senhaAtual" placeholder="••••••••"/>
          </div>
          <div>
            <label class="field-label" for="novaSenha">Nova Senha</label>
            <input type="password" class="input-base" id="novaSenha" placeholder="••••••••"/>
          </div>
        </div>
        <div style="margin-top:16px">
          <label class="field-label" for="confirmarSenha">Confirmar Nova Senha</label>
          <input type="password" class="input-base" id="confirmarSenha" placeholder="••••••••" style="max-width:48%"/>
        </div>
        <div class="actions-row" style="margin-top:16px">
          <button class="btn-enviar" onclick="alterarSenha()">Salvar Senha</button>
        </div>
      </div>
    </div>

    <!-- ALTERAR NOME -->
    <!-- ALTERAR NOME -->
<div class="card">
  <div class="card-head">
    <div class="card-head-title">Alterar Nome</div>
  </div>
  <div class="card-body">
    <div class="motivo-row">
      <div>
        <label class="field-label" for="novoNome">Novo Nome</label>
        <input type="text" class="input-base" id="novoNome" placeholder="Seu nome..."/>
      </div>
      <div>
        <label class="field-label" for="senhaConfirmaNome">Confirme sua Senha</label>
        <input type="password" class="input-base" id="senhaConfirmaNome" placeholder="••••••••"/>
      </div>
    </div>
    <div class="actions-row" style="margin-top:16px">
      <button class="btn-enviar" onclick="alterarNome()">Salvar Nome</button>
    </div>
  </div>
</div>

  </main>

  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span id="toastMsg"></span>
  </div>

  <script src="js/configuracoes.js"></script>
</body>
</html>
