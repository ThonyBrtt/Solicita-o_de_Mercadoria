<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Revest Bem – Estoque</title>
  <link rel="icon" href="Imagens/Logo.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Css/catologo.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-icon">
        <img src="Imagens/Logo.png" alt="Logo" width="32" height="32" style="object-fit:contain; border-radius:4px;">
      </div>
      <div class="brand-name">Revestbem<small>Estoque</small></div>
    </div>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="user-avatar" id="avatarLetra">L</div>
        <div class="user-info">
          <div class="u-name" id="usuarioNome">Logística</div>
          <div class="u-role" id="perfilUsuario">Logística</div>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sair
      </button>
    </div>
  </header>

  <aside class="sidebar">
    <div class="sidebar-section">Painel</div>
    <a class="nav-item" href="logistica.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      Todas as Solicitações
    </a>
    <a class="nav-item" href="usuarios.html">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      Usuários
    </a>
    <div class="sidebar-section">Sistema</div>
    <a class="nav-item active" href="estoque.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      Catalogo
    </a>
    <a class="nav-item" href="configuracoesLogistica.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.07 4.93l-1.41 1.41M16.24 7.76a6 6 0 1 0 0 8.49"/>
      </svg>
      Configurações
    </a>
  </aside>

  <main class="main">

    <div class="page-header">
    <div>
        <div class="page-title">Estoque</div>
        <div class="page-subtitle">Gerencie e cadastre os produtos do estoque</div>
    </div>
    <div class="view-toggle">
        <button class="btn-toggle active" id="btnGrid" onclick="setView('grid')" title="Visualização em grade">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
            </svg>
        </button>
        <button class="btn-toggle" id="btnLista" onclick="setView('lista')" title="Visualização em lista">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
                <line x1="8" y1="18" x2="21" y2="18"/>
                <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/>
                <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
        </button>
    </div>
</div>

    <!-- CADASTRAR -->
    <div class="card">
  <div class="card-head">
    <div class="card-head-title">Cadastrar Novo Produto</div>
  </div>
  <div class="card-body">
    <div class="motivo-row">
      <div>
        <label class="field-label">Nome</label>
        <input type="text" class="input-base" id="nome" placeholder="Nome do produto"/>
      </div>
      <div>
        <label class="field-label">SKU</label>
        <input type="text" class="input-base" id="sku" placeholder="Ex: CT-001"/>
      </div>
    </div>
    <div class="motivo-row" style="margin-top:12px">
      <div>
        <label class="field-label">Categoria</label>
        <select class="input-base" id="categoria">
          <option value="">Selecione...</option>
          <option value="Cortina">Cortina</option>
          <option value="Blackout">Blackout</option>
          <option value="Capotaria">Capotaria</option>
          <option value="Estofados">Estofados</option>
          <option value="Automotivo">Automotivo</option>
        </select>
      </div>
      <div>
        <label class="field-label">Quantidade</label>
        <input type="number" class="input-base" id="quantidade" placeholder="0" min="0"/>
      </div>
    </div>
    <div class="motivo-row" style="margin-top:12px">
      <div>
        <label class="field-label">Quantidade Mínima</label>
        <input type="number" class="input-base" id="quantidade_minima" placeholder="0" min="0"/>
      </div>
      <div>
        <label class="field-label">Lote</label>
        <input type="number" class="input-base" id="lote" placeholder="0" min="0"/>
      </div>
    </div>

    <!-- CAMPO IMAGEM -->
    <div style="margin-top:12px">
      <label class="field-label">Imagem do Produto</label>
      <label class="img-upload-label" id="imgUploadLabel">
        <input type="file" id="imagemProduto" accept="image/*" style="display:none" onchange="previewImagem(this)"/>
        <div class="img-upload-placeholder" id="imgPlaceholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <span>Clique para selecionar uma imagem</span>
        </div>
        <img id="imgPreview" src="" alt="Preview" style="display:none; width:100%; height:160px; object-fit:cover; border-radius:7px;"/>
      </label>
      <button class="btn-remover-img" id="btnRemoverImg" style="display:none" onclick="removerImagem()">✕ Remover imagem</button>
    </div>

    <div class="actions-row" style="margin-top:16px">
      <button class="btn-enviar" onclick="cadastrarProduto()">+ Cadastrar Produto</button>
    </div>
  </div>
</div>

    <!-- LISTAGEM -->
<div class="card" style="animation-delay:0.12s">
      <div class="card-head dark">
        <div class="card-head-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          Produtos
          <span class="badge-count" id="totalProdutos">0</span>
        </div>
      </div>

      <!-- GRID VIEW -->
      <div id="viewGrid" class="catalogo-grid"></div>

      <!-- LISTA VIEW -->
      <div id="viewLista" class="table-wrap" style="display:none">
        <table>
          <thead>
            <tr>
              <th>SKU</th>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Material</th>
              <th>Estoque</th>
              <th>Status</th>
              <th style="width:80px"></th>
            </tr>
          </thead>
          <tbody id="tabelaLista"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- ── MODAL DETALHES ── -->
  <div class="overlay" id="overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-header-title" id="modalTitulo">Detalhes do Produto</div>
        <button class="modal-close" onclick="fecharModal()">✕</button>
      </div>
      <div class="modal-body">
        
        <div class="modal-fields" id="modalFields"></div>
      </div>
      <div class="modal-btns">
    <button class="btn-cancel" onclick="fecharModal()">Fechar</button>
    <button class="btn-confirm" id="btnConfirm">Salvar Alterações</button>
</div>
    </div>
  </div>

  <!-- ── TOAST ── -->
  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span id="toastMsg"></span>
  </div>
  <script src="js/estoque.js"></script>
</body>
</html>
