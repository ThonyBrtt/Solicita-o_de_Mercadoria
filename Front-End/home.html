<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Revest Bem - Solicitação</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="Css/home.css" rel="stylesheet" />
  <link rel="icon" href="Imagens/Revestico.ico" type="image/x-icon">
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <img src="Imagens/Logo.png" width="40" height="40" class="me-2 rounded-circle" alt="Logo">
        Revest Bem - Solicitações
      </a>
      <div class="navbar-nav ms-auto">
        <span class="navbar-text me-3" id="usuarioNome">VENDEDOR</span>
        <span class="navbar-text me-3 text-warning" id="perfilUsuario">Vendedor</span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Sair</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <!-- HEADER SOLICITANTE -->
    <div class="row mb-4">
      <div class="col-md-8">
        <h2 class="fw-bold text-dark mb-1">Nova Solicitação</h2>
        <div class="alert alert-info">
        </div>
      </div>
      <div class="col-md-4 text-end">
        <span class="badge bg-success fs-6">Status: Criando</span>
      </div>
    </div>

    <!-- FORM SOLICITAÇÃO -->
    <form id="formSolicitacao">
      <!-- LOJA -->
      <div class="row mb-4">
        <div class="col-md-6">
        </div>
      </div>

      <!-- BUSCA PRODUTO COM CATEGORIA -->
      <div class="card mb-4 shadow-sm">
        <div class="card-header bg-light">
          <h6 class="mb-0"><i class="bi bi-search"></i> Buscar Produto</h6>
        </div>
        <div class="card-body">
          <div class="input-group">
            <input type="text" class="form-control" id="buscaProduto" 
                   placeholder="Digite SKU ou nome (ex: cimento, tijolo)..." />
            <select class="form-select" id="categoria" style="max-width: 200px;">
              <option value="">Todas Categorias</option>
              <option value="cimento">Cortina</option>
              <option value="areia">Blackout</option>
              <option value="tijolo">Capotaria</option>
              <option value="ceramica">Estofados</option>
              <option value="argamassa">Automotivo</option>
            </select>
            <button class="btn btn-primary" type="button" onclick="buscarProduto()">
              <i class="bi bi-search"></i> Buscar
            </button>
          </div>
          <div id="resultadoBusca" class="mt-3"></div>
        </div>
      </div>

      <!-- ITENS -->
      <div class="card mb-4 shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center bg-primary text-white">
          <h6 class="mb-0 fw-semibold">
            <i class="bi bi-cart"></i> Itens Solicitados 
            <span id="totalItens" class="badge bg-light text-dark ms-2">0 itens</span>
          </h6>
        </div>
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-dark">
              <tr>
                <th width="100">SKU</th>
                <th>Produto</th>
                <th width="100">Categoria</th>
                <th width="80">Material</th>
                <th width="80">Metragem</th>
              </tr>
            </thead>
            <tbody id="itensTabela"></tbody>
          </table>
        </div>
      </div>

      <!-- MOTIVO -->
      <div class="card mb-4 shadow-sm">
        <div class="card-body">
          <div class="row">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Motivo da Saída *</label>
              <select class="form-select" id="motivo" required>
                <option value="">Selecione o motivo...</option>
                <option value="venda">Venda peça fechada</option>
                <option value="venda-entrega">Venda para entrega</option>
                <option value="corte">Para Corte</option>
                <option value="reposicao">Reposição</option>

              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Observações</label>
              <textarea class="form-control" id="observacoes" rows="3" 
                        placeholder="Ex: Cliente João Silva, telefone (11)99999-9999..."></textarea>
            </div>
          </div>
        </div>
      </div>

      <!-- BOTÕES -->
      <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <button type="button" class="btn btn-outline-secondary btn-lg me-md-2" onclick="limparFormulario()">
          <i class="bi bi-arrow-repeat"></i> Limpar Tudo
        </button>
        <button type="submit" class="btn btn-success btn-lg" id="btnEnviar">
          <i class="bi bi-check-lg"></i> Enviar Solicitação
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"></script>
  <script src="sistema.js"></script>
</body>
</html>
