<!doctype html>
<html lang="pt-BR" data-bs-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sistema Revest Bem - Solicitação de Mercadorias" />
    <meta name="author" content="Revest Bem" />
    <link rel="icon" href="Imagens/Revestico.ico" type="image/x-icon">   
    <title>Revest Bem - Login</title>
    
    <!-- FONTES PREMIUM -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    
    <script src="../assets/js/color-modes.js"></script>
    <link href="../assets/dist/css/bootstrap.min.css" rel="stylesheet" />
    <meta name="theme-color" content="#D9C9A2" />
    
    <!-- CSS REVEST BEM -->
    <link href="Css/sing-up.css" rel="stylesheet" />
  </head>
  <body class="d-flex align-items-center py-4 bg-body-tertiary">
    <!-- ICONES SVG (MANTER) -->
    <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
      <!-- ... todos os symbols SVG originais ... -->
    </svg>


    <!-- TOGGLE DARK MODE (MANTER) -->
    <div class="dropdown position-fixed bottom-0 end-0 mb-3 me-3 bd-mode-toggle">
      <!-- ... todo o dropdown original ... -->
    </div>

    <!-- FORMULÁRIO REVEST BEM -->
    <main class="form-signin w-100 m-auto">
      <form>
        <!-- LOGO REVEST BEM -->
    <img class="mb-4" 
     src="Imagens/Logo.png" 
     alt="Revest Bem" 
     width="100" 
     height="100" />

        <!-- EMAIL -->
        <div class="form-floating">
          <input type="Usuario" 
                 class="form-control" 
                 id="floatingInput" 
                 placeholder="Usuario" 
                 required />
          <label for="floatingInput">Vendedor / Adim</label>
        </div>
        
        <!-- SENHA -->
        <div class="form-floating">
          <input type="password" 
                 class="form-control" 
                 id="floatingPassword" 
                 placeholder="Senha" 
                 required />
          <label for="floatingPassword">Senha</label>
        </div>
        
        <!-- REMEMBER ME -->
        <div class="form-check text-start my-3">
          <input class="form-check-input" 
                 type="checkbox" 
                 value="remember-me" 
                 id="checkDefault" />
          <label class="form-check-label" for="checkDefault">
            Lembrar do Login
          </label>
        </div>
        
        <!-- BOTÃO ENTRAR -->
        <button onclick="window.location.href='home.html'" 
        class="btn btn-primary w-100 py-2 mb-4">
        Entrar no Sistema
        </button>>
        
        <!-- LINK CADASTRO -->
        <div class="text-center">
          <a href="#" class="text-decoration-none text-muted">Precisa de ajuda?</a>
        </div>
        
        <!-- RODAPÉ -->
        <p class="mt-5 mb-3 text-body-secondary text-center">
          © 2026 Revest Bem - Sistema de Estoque
        </p>
      </form>
    </main>

    <script src="../assets/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
