<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Revest Bem – Painel Logística</title>
  <link rel="icon" href="https://imgs.search.brave.com/jAbi_b0DUW7iG592fu7PpbmZFdmylgVJj3RAqn3UMDs/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly96ZWxk/YS5jb20uYnIvd3At/Y29udGVudC91cGxv/YWRzL2dhbWVzL21h/am9yYXNfbWFzay9h/cnQvYm9zc2VzL21t/X2Jvc3NfbWFqb3Jh/c21hc2stMzAweDI2/OS5wbmc" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Css/home.css">
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-brand">
  <div class="brand-icon">
    <img src="https://imgs.search.brave.com/jAbi_b0DUW7iG592fu7PpbmZFdmylgVJj3RAqn3UMDs/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly96ZWxk/YS5jb20uYnIvd3At/Y29udGVudC91cGxv/YWRzL2dhbWVzL21h/am9yYXNfbWFzay9h/cnQvYm9zc2VzL21t/X2Jvc3NfbWFqb3Jh/c21hc2stMzAweDI2/OS5wbmc" alt="LogoEmpresa" width="32" height="32" 
         style="object-fit:contain; border-radius:4px;">
  </div>
  <div class="brand-name">
    Nome empresa
    <small>Estoque</small>
  </div>
</div>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="user-avatar" id="avatarLetra">V</div>
        <div class="user-info">
          <div class="u-name" id="usuarioNome">Vendedor</div>
          <div class="u-role" id="perfilUsuario">Vendedor</div>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sair
      </button>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-section">Painel</div>
    <a class="nav-item active" href="#">Todas as Solicitações</a>
    <div class="sidebar-section">Sistema</div>
    <a class="nav-item" href="#" onclick="showToast('Em breve disponível')">Relatórios</a>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <div class="page-header">
      <div>
        <div class="page-title">Painel de Solicitações</div>
        <div class="page-subtitle">Gerencie todas as solicitações em aberto</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head dark">
        <div class="card-head-title">Solicitações em Aberto</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Solicitante</th>
              <th>Produto</th>
              <th>Quantidade</th>
              <th>Motivo</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaAdmin">
            <tr class="empty-row">
              <td colspan="7">Carregando...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span id="toastMsg"></span>
  </div>

  <script src="js/logistica.js"></script>
</body>
</html>
